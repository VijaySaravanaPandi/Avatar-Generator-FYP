<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HamNoSys Sign Language Translator</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- JASigning CWASA -->
    <link rel="stylesheet" href="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2026/cwa/cwasa.css" />
    <script type="text/javascript" src="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2026/cwa/allcsa.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body onload="CWASA.init({
    'cwaBase': 'https://vhg.cmp.uea.ac.uk/tech/jas/vhg2026/cwa/',
    'avsbsl' : ['luna', 'siggi', 'anna', 'marc', 'francoise'],
    'avSettings' : { 'avList': 'avsbsl', 'initAv': 'anna' }
});">

    <!-- Background Decoration -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <header>
            <h1>HamNoSys <span>Translator</span></h1>
            <p>Upload a sign language video to convert it into HamNoSys and render it in 3D.</p>
        </header>

        <main class="grid-container">
            
            <!-- Left Column: Upload & Results -->
            <div class="left-panel">
                
                <!-- Upload Section -->
                <div class="card glass-card" id="upload-card">
                    <div class="upload-area" id="drop-zone">
                        <input type="file" id="video-input" accept="video/mp4,video/x-m4v,video/*" hidden>
                        <div class="upload-content">
                            <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="upload-text">Drag & drop your video here</p>
                            <span class="upload-subtext">or click to browse</span>
                        </div>
                    </div>
                    
                    <div id="loading-indicator" class="hidden">
                        <div class="spinner"></div>
                        <p>Processing video... this might take a minute.</p>
                    </div>
                </div>

                <!-- HamNoSys Results Section -->
                <div class="card glass-card result-card hidden" id="result-card">
                    <h3>Translation Results</h3>
                    
                    <div class="result-group">
                        <label>HamNoSys Tags</label>
                        <div class="result-box" id="hamnosys-tags"></div>
                    </div>
                    
                    <div class="result-group">
                        <label>HamNoSys Characters (Font)</label>
                        <div class="result-box hamnosys-font" id="hamnosys-chars"></div>
                    </div>

                    <button id="play-btn" class="btn-primary">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Play Animation
                    </button>
                </div>
            </div>

            <!-- Right Column: Avatar Player -->
            <div class="right-panel">
                <div class="card glass-card avatar-card">
                    <h3>3D Avatar</h3>
                    <div class="avatar-container">
                        <!-- JASigning Avatar injected here -->
                        <div class="CWASAAvatar av0"></div>
                        
                        <!-- Hidden controls required by JASigning to initialize properly -->
                        <div style="display: none;">
                            <span class="CWASAAvMenu av0"></span>
                            <span class="CWASAAmbBox av0"></span>
                            <input class="txtLogSpeed av0" value="+1.0" type="text" />
                            <input type="button" value="-" class="bttnSpeedDown av0" />
                            <input type="button" value="+" class="bttnSpeedUp av0" />
                            <input type="button" value="Reset" class="bttnSpeedReset av0" />
                            <input class="txtSiGMLURL av0" value="" type="text" />
                            <textarea class="txtaSiGMLText av0" rows="10"></textarea>
                            <input type="button" value="Play SiGML URL" class="bttnPlaySiGMLURL av0" />
                            <input type="button" value="Play SiGML Text" class="bttnPlaySiGMLText av0" />
                            <input type="button" value="Stop" class="bttnStop av0" />
                            <input value="Suspend" class="bttnSuspend av0" type="button">
                            <input value="Resume" class="bttnResume av0" type="button">
                            <input value="+1" class="bttnNextF av0" type="button">
                            <input value="-1" class="bttnPrevF av0" type="button">
                            <input class="txtSF av0" value="0/0" type="text">
                            <input class="txtGloss av0" value="[none]" type="text">
                            <input class="txtFPS av0" value="00.00" type="text" />
                            <input type="text" class="statusExtra av0" />
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Hidden textarea to store SiGML temporarily if needed -->
    <textarea id="sigml-storage" hidden></textarea>

    <script src="/static/js/app.js"></script>
</body>
</html>
